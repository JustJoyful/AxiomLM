[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlm"
version = "0.1.0"
description = "Your textbooks. Locally. Answered."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "JustJoyful" }
]
dependencies = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=1.27.0",
    "marker-pdf>=0.3.0",
    "albumentations>=1.3.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers==5.4.1",
    "transformers==4.57.6",
    "peft==0.19.1",
    "chromadb==1.5.8",
    "textual==8.2.6",
    "tomlkit>=0.13,<1",
    "httpx==0.28.1",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
cuda = [
    "torch==2.11.0+cu128; sys_platform == 'linux'",
    "torchvision==0.26.0+cu128; sys_platform == 'linux'",
]
cpu = [
    "torch==2.11.0+cpu; sys_platform == 'linux'",
    "torchvision==0.26.0+cpu; sys_platform == 'linux'",
]
dev = [
    "black>=23.0",           # code formatting
    "ruff>=0.1",             # linting
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "pytest-textual-snapshot>=1.1",           # testing
    "mypy>=1.0",             # type checking
]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
axiomlm = "src.tui:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.ui" = ["*.tcss"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
