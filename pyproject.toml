[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlm"
version = "0.1.0"
description = "Your textbooks. Locally. Answered."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "JustJoyful" }
]
dependencies = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=1.27.0",
    "marker-pdf>=0.3.0",
    "albumentations>=1.3.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "textual>=0.70.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "pyperclip>=1.8.2"
]

[project.optional-dependencies]
dev = [
    "black>=23.0",           # code formatting
    "ruff>=0.1",             # linting
    "pytest>=7.0",           # testing
    "mypy>=1.0",             # type checking
]

[project.scripts]
axiomlm = "src.tui:main"

[tool.setuptools]
packages = ["src"]
